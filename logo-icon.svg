    <path d="M 16 18 C 22 26, 28 38, 34 48" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none" />

    <path d="M 34 50 C 34 30, 26 8, 42 4 C 54 16, 52 36, 34 50 Z" fill="url(#iconLeafGrad)" />
    <path d="M 40 8 C 37 20, 36 34, 35 48" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45" fill="none" />

