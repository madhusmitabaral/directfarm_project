<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DirectFarm - Register</title>
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="logo-icon.svg" alt="DirectFarm Logo">
            <span class="logo-text">DirectFarm</span>
        </a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="marketplace.html">Marketplace</a></li>
            <li><a href="login.html">Sign In</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="register-container">
            <h2>Join DirectFarm</h2>
            <p class="subtitle">Connect directly with zero middleman commissions</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" required placeholder="e.g. D.K. Tripathi">
                    <div id="nameError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (10 digits) *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="9876543210" maxlength="10">
                    <div id="phoneError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required placeholder="farmer@example.com">
                    <div id="emailError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="userType">Register As *</label>
                    <select id="userType" name="userType" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="farmer">Farmer (Sell produce directly to consumers)</option>
                        <option value="consumer">Consumer (Buy fresh produce from farmers)</option>
                    </select>
                    <div id="userTypeError" class="error-message"></div>
                </div>

                <div class="form-group" id="farmNameGroup" style="display: none;">
                    <label for="farmName">Farm / Nursery Name *</label>
                    <input type="text" id="farmName" name="farmName" placeholder="e.g. Green Valley Organics">
                    <div id="farmNameError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="address">Address / Farm Location *</label>
                    <input type="text" id="address" name="address" required placeholder="e.g. Burdwan Agro Zone, West Bengal">
                    <div id="addressError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password (at least 6 characters) *</label>
                    <input type="password" id="password" name="password" required placeholder="Create password" minlength="6">
                    <div id="passwordError" class="error-message"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password">
                    <div id="confirmPasswordError" class="error-message"></div>
                </div>

                <button type="submit" class="btn-register">Create Account</button>
            </form>
            <p class="login-link">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </main>
    
    <footer>
        <div class="social-links">
            <a href="#" target="_blank" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
            <a href="#" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="#" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" target="_blank" title="Twitter"><i class="bi bi-twitter"></i></a>
        </div>
        <div class="copyright">
            <p>&copy; 2026 DirectFarm. All rights reserved.</p>
        </div>
    </footer>

    <script src="load-auth.js"></script>
    <script src="register.js"></script>
</body>
</html>
