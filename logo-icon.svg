<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="iconLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="50%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <linearGradient id="iconLeafAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#388e3c" />
    </linearGradient>
    <linearGradient id="iconSoilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
