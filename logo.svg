<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20" />
      <stop offset="50%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#4caf50" />
    </linearGradient>
    <linearGradient id="leafAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784" />
      <stop offset="100%" stop-color="#388e3c" />
    </linearGradient>
    
    <linearGradient id="sunSoilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b5e20" flood-opacity="0.18" />
    </filter>
  </defs>

  <g transform="translate(10, 6)" filter="url(#subtleGlow)">
    
    <path d="M 12 56 C 22 52, 38 52, 56 56 C 50 62, 28 65, 12 56 Z" fill="url(#sunSoilGrad)" />
    <path d="M 18 50 C 26 47, 40 47, 52 50 C 46 54, 30 56, 18 50 Z" fill="#fbbf24" opacity="0.9" />

    <path d="M 34 48 C 20 44, 8 28, 14 12 C 26 12, 34 26, 34 48 Z" fill="url(#leafAccent)" />
    <path d="M 16 16 C 22 24, 28 36, 34 46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none" />

    <path d="M 34 48 C 34 28, 26 6, 42 2 C 54 14, 52 34, 34 48 Z" fill="url(#leafGrad)" />
    <path d="M 40 6 C 37 18, 36 32, 35 46" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45" fill="none" />

    <path d="M 6 36 C 4 18, 18 4, 38 4 C 44 4, 50 6, 54 9" 
          stroke="url(#arcGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0" fill="none" />
    
    <polygon points="54,4 58,12 50,11" fill="#10b981" />
  </g>

  <g transform="translate(82, 0)">
    
    <text x="0" y="47" font-family="'Roboto', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#1b5e20" letter-spacing="-0.5">Direct</text>
    
    <text x="96" y="47" font-family="'Roboto', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#2e7d32" letter-spacing="-0.5">Farm</text>
    
    <path d="M 172 26 C 176 19, 184 17, 188 18 C 188 23, 182 28, 177 28 Z" fill="#4caf50" />

    <text x="2" y="65" font-family="'Roboto', 'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="9" fill="#16a34a" letter-spacing="2.4">FARM TO TABLE</text>
    <circle cx="92" cy="62" r="2" fill="#f59e0b" />
    <text x="100" y="65" font-family="'Roboto', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="9" fill="#d97706" letter-spacing="1.8">ZERO MIDDLEMEN</text>
  </g>
</svg>
