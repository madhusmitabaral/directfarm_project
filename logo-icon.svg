    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b5e20" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="80" height="80" rx="18" fill="url(#iconBgGrad)" stroke="#bbf7d0" stroke-width="1.5" />

