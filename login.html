<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Direct Farm</title>
    <link rel="icon" type="image/svg+xml" href="logo-icon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">
            <img src="logo-icon.svg" alt="DirectFarm Logo">
            <span class="logo-text">DirectFarm</span>
        </a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="marketplace.html">Marketplace</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
   
    <div class="login-container">
        <div class="login">
            <h2 class="login-title">LOGIN TO DIRECTFARM</h2>
            <p class="login-subtitle">Connect directly with zero middleman interference</p>

            <div class="demo-login-box">
                <div class="demo-login-title">Quick Demo Login:</div>
                <div class="demo-buttons">
                    <button type="button" class="btn-demo" id="demo-farmer-btn">
                        <i class="bi bi-person-badge"></i> Farmer Login
                    </button>
                    <button type="button" class="btn-demo" id="demo-consumer-btn">
                        <i class="bi bi-cart"></i> Consumer Login
                    </button>
                </div>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="name@example.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div id="login-error-msg" style="color: #dc2626; font-size: 13px; text-align: center; display: none;"></div>
                <button type="submit" class="login-button"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
            </form>
            <p class="register-link">Don't have an account yet? <a href="register.html">Register here</a></p>
        </div>
    </div>

    <footer>
        <div class="social-links">
            <a href="#" target="_blank" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
            <a href="#" target="_blank" title="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="#" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="#" target="_blank" title="Twitter"><i class="bi bi-twitter"></i></a>
        </div>
        <div class="copyright">
            <p>&copy; 2026 DirectFarm. Connecting Farmers & Consumers Directly.</p>
        </div>
    </footer>

    <script src="load-auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
